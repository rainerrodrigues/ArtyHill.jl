name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '2'

  vcan:
    # Real SocketCAN I/O on a virtual CAN bus.
    name: SocketCAN (vcan0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create vcan0 (CAN FD capable)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72 up
          ip -details link show vcan0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          ARTYHILL_VCAN: vcan0
          JULIA_NUM_THREADS: '2'

  ethercat:
    # Real SOEM 1.4 master ↔ emulated CiA 402 drives over a veth pair, inside
    # an unprivileged user + network namespace (test/ethercat/run.sh).
    name: EtherCAT (SOEM ↔ emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them via AppArmor by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/artyhill-soem
          key: soem-1.4.0-${{ runner.os }}
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run EtherCAT end-to-end tests
        run: test/ethercat/run.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
